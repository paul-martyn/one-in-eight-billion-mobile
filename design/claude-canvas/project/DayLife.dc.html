<div style="position: absolute; left: 16px; right: 16px; top: 46px; display: flex; align-items: center; justify-content: space-between">

<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ cycleSpeed }}" aria-label="Change speed" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 22px; background: #ffffff; color: #17352e; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">{{ speed }}×</button>
<button type="button" onClick="{{ togglePause }}" aria-label="{{ pauseLabel }}" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: #ffffff; color: #17352e; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{ running }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>

<span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #f9d9d2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17352e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6Z"></path></svg></span>

</li>

<button type="button" style="min-height: 116px; padding: 16px; border: 0; border-radius: 24px; background: #f2b33d; color: #17352e; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800; line-height: 1.15">Work the counter</span><span style="font-size: 13px; line-height: 1.35; color: #2f4a43">More money now. School ends.</span></button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const speeds = [1, 4, 16];
    const speed = st.speed || 4;
    const paused = !!st.paused;
    return {
      speed: speed,
      paused: paused,
      running: !paused,
      pauseLabel: paused ? 'Resume' : 'Pause',
      togglePause: () => this.setState({ paused: !paused }),
      cycleSpeed: () => this.setState({ speed: speeds[(speeds.indexOf(speed) + 1) % speeds.length] })
    };
  }
}
</script>
