<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
main[data-theme=light] a:focus-visible,main[data-theme=light] button:focus-visible{outline:3px solid #17352e;outline-offset:4px}
main[data-theme=dark] a:focus-visible,main[data-theme=dark] button:focus-visible{outline:3px solid #f6cfe0;outline-offset:4px}
</style>
</helmet>
<main data-theme="{{ theme }}" style="position: relative; width: 393px; height: 852px; box-sizing: border-box; padding: 60px 28px 112px; overflow: hidden; background: {{ t.bg }}; color: {{ t.ink }}; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center">
<div aria-hidden="true" style="position: absolute; left: -33px; top: 66px; width: 460px; height: 460px; border-radius: 50%; background: {{ t.glow }}"></div>
<h1 style="position: relative; margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 76px; font-weight: 800; line-height: 74px; letter-spacing: -2.5px; white-space: nowrap">1 in <span style="color: {{ t.accent }}">8</span> B</h1>
<div style="position: relative; width: 300px; height: 300px; margin-top: 12px; flex: none">
<dc-import name="Globe" size="300" variant="halftone" land="{{ g.land }}" ocean="{{ g.ocean }}" shade="{{ g.shade }}" night="{{ g.night }}" rim="{{ g.rim }}" grid="{{ g.grid }}" flash="{{ g.flash }}" marker="{{ g.marker }}" marker-ring="{{ g.ring }}" dot="1.15" spin="8" start-lon="-40" hint-size="300px,300px"></dc-import>
</div>
<p style="position: relative; margin: 20px 0 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -0.2px">Someone is born right now.<br><span style="color: {{ t.accent }}">This time, it’s you.</span></p>
<div style="position: relative; display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; width: 300px; height: 80px; box-sizing: border-box; margin-top: 30px; border: 1.5px solid {{ t.dialLine }}; border-radius: 12px; background: {{ t.dialBg }}">
<span style="position: absolute; left: 50%; top: -9px; transform: translateX(-50%); padding: 0 10px; background: {{ t.bg }}; font-size: 11px; font-weight: 700; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ t.muted }}; white-space: nowrap">Since you opened</span>
<div>
<p style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{ bornCount }}</p>
<p style="display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 0; font-size: 13px; line-height: 1.2; color: {{ t.muted }}"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{ t.bornDot }}"></span>born</p>
</div>
<span aria-hidden="true" style="width: 1px; height: 40px; background: {{ t.dialLine }}"></span>
<div>
<p style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{ diedCount }}</p>
<p style="display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 0; font-size: 13px; line-height: 1.2; color: {{ t.muted }}"><span style="width: 7px; height: 7px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid {{ t.muted }}"></span>passed away</p>
</div>
</div>
<a href="{{ rollHref }}" style="position: relative; margin-top: auto; display: flex; align-items: center; justify-content: space-between; width: 204px; min-height: 64px; box-sizing: border-box; padding: 0 8px 0 26px; border-radius: 32px; background: {{ t.btnBg }}; color: {{ t.btnInk }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 20px; font-weight: 800; text-decoration: none">Be Born<span style="width: 48px; height: 48px; border-radius: 24px; background: {{ t.btnDot }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ t.btnArrow }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<svg width="393" height="852" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; pointer-events: none; mix-blend-mode: {{ t.grainBlend }}; opacity: {{ t.grainOp }}">
<filter id="{{ grainId }}"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="393" height="852" filter="{{ grainUrl }}"></rect>
</svg>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":393,"height":852}}'>
// Light is the daylight look from direction E; dark takes the night colours from direction A.
// The only backdrop is a soft glow behind the globe, in the colour of its oceans.
// Be Born leads to the birth roll, where the same globe spins and picks the country.
var THEMES = {
  light: {
    bg: '#f4ede1', ink: '#17352e', muted: '#4e5f58', accent: '#e5533c', bornDot: '#e5533c',
    dialBg: 'rgba(255,255,255,0.5)', dialLine: 'rgba(23,53,46,0.16)',
    btnBg: '#e5533c', btnInk: '#ffffff', btnDot: '#17352e', btnArrow: '#ffffff',
    glow: 'radial-gradient(closest-side, rgba(106,174,224,0.5) 0%, rgba(106,174,224,0.3) 58%, rgba(106,174,224,0) 100%)',
    grainBlend: 'multiply', grainOp: 0.18,
    globe: { land: '#17352e', ocean: '#a9d3ee', shade: '#4f8fc0', night: 'rgba(23,53,46,0.22)', rim: '', grid: '', flash: '#e5533c', marker: '#e5533c', ring: '#f4ede1' }
  },
  dark: {
    bg: '#18171c', ink: '#f6f1ea', muted: '#a9a3b8', accent: '#ff9eb0', bornDot: '#ffd9a0',
    dialBg: 'rgba(255,255,255,0.04)', dialLine: 'rgba(246,241,234,0.16)',
    btnBg: '#f6cfe0', btnInk: '#18171c', btnDot: '#18171c', btnArrow: '#f6cfe0',
    glow: 'radial-gradient(closest-side, rgba(118,98,240,0.55) 0%, rgba(118,98,240,0.3) 58%, rgba(118,98,240,0) 100%)',
    grainBlend: 'overlay', grainOp: 0.3,
    globe: { land: '#f4e4dc', ocean: '#3b30a0', shade: '#17124a', night: 'rgba(12,10,32,0.22)', rim: 'rgba(246,241,234,0.35)', grid: 'rgba(246,241,234,0.08)', flash: '#ffd9a0', marker: '#ff9eb0', ring: '#18171c' }
  }
};

class Component extends DCLogic {
  componentDidMount() {
    this.openedAt = Date.now();
    this.timer = setInterval(() => this.forceUpdate(), 250);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = THEMES[theme];
    const secs = this.openedAt ? (Date.now() - this.openedAt) / 1000 : 0;
    // About 4.2 births and 2 deaths every second worldwide.
    return {
      theme: theme,
      t: t,
      g: t.globe,
      grainId: 'st-grain-' + theme,
      grainUrl: 'url(#st-grain-' + theme + ')',
      rollHref: theme === 'dark' ? 'RollDark.dc.html' : 'Roll.dc.html',
      bornCount: Math.floor(secs * 4.2).toLocaleString('en-US'),
      diedCount: Math.floor(secs * 2).toLocaleString('en-US')
    };
  }
}
</script>
</body>
</html>
