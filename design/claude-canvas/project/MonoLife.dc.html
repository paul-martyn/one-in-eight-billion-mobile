<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono Novel — Life</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">

body{margin:0}
a{color:#ffffff}a:hover{color:#d6d6d6}

</helmet>

<div style="height: 280px; border-radius: 18px; overflow: hidden">
<svg width="333" height="280" viewBox="0 0 333 280" role="img" aria-label="Aarav, eyes closed, between his mother and father, a kite above them" style="display: block">
<defs>

</div>
<h1 style="margin: 18px 4px 0; font-size: 28px; font-weight: 600; line-height: 1.1">Aarav Srivastava</h1>
<p style="margin: 8px 4px 0; font-size: 15px; line-height: 1.5; color: #c8c8c8">Fifteen. Lucknow, India. The shop is quiet this year, and so is your father.</p>
<div style="height: 1px; margin: 16px 4px 14px; background: #4a4a4a"></div>
<div style="display: flex; align-items: flex-end; gap: 26px; padding: 0 4px">
<div><p style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2">82</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: #9e9e9e">health</p></div>
<div><p style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2">64</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: #9e9e9e">happiness</p></div>
<div><p style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2">Top 62%</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: #9e9e9e">income in India</p></div>
<button type="button" onClick="{{ togglePause }}" aria-label="{{ pauseLabel }}" style="margin-left: auto; width: 44px; height: 44px; padding: 0; border: 2px solid #ffffff; border-radius: 22px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{ running }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5Z" fill="currentColor"></path></svg></sc-if>
</button>
</div>
</article>
<ol style="list-style: none; margin: 18px 4px 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 14px; font-size: 15px; line-height: 1.45; color: #9e9e9e"><span style="flex: none; width: 30px; font-weight: 600">Sep</span><span>Ananya left for Delhi. Her bed is still made.</span></li>
<li style="display: flex; gap: 14px; font-size: 15px; line-height: 1.45"><span style="flex: none; width: 30px; font-weight: 600; color: #9e9e9e">Oct</span><span>Your father asks you to work the counter instead of starting grade 11.</span></li>
</ol>
<div style="display: flex; gap: 10px; margin-top: auto">
<button type="button" style="flex: 1 1 0; min-height: 52px; border: 0; border-radius: 26px; background: #ffffff; color: #000000; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Stay in school</button>
<button type="button" style="flex: 1 1 0; min-height: 52px; border: 2px solid #ffffff; border-radius: 26px; background: transparent; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Help the shop</button>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const paused = !!(this.state && this.state.paused);
    return {
      paused: paused,
      running: !paused,
      pauseLabel: paused ? 'Resume' : 'Pause',
      togglePause: () => this.setState({ paused: !paused })
    };
  }
}
</script>
</body>
</html>
