// Two rows of seven squares.
var MAX_CURRENCIES = 14;
var PRESS = 'inset 0 -3px 0 rgba(90,52,24,0.22)';
var PRESS_ON = 'inset 0 -3px 0 rgba(90,52,24,0.22), inset 0 3px 0 rgba(255,255,255,0.5)';

// Inside the prototype the host passes `nav` and moves between screens itself; on its own an
// artboard follows plain links.
function linkTo(self, stem) {
  return typeof self.props.nav === 'function'
    ? { href: null, go: () => self.props.nav(stem) }
    : { href: stem + '.dc.html', go: null };
}
var STICKER_STEMS = { people: 'PeopleCute', activities: 'ActivitiesCute', life: 'LiveCute', money: 'MoneyCute', odds: 'OddsLife' };
function stickerLinks(self) {
  const out = {};
  Object.keys(STICKER_STEMS).forEach((k) => { out[k] = linkTo(self, STICKER_STEMS[k]); });
  return out;
}

class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = LANGS.find((l) => l.id === (st.lang || DEVICE));
    const offered = lang.cur.slice(0, MAX_CURRENCIES);
    const cur = offered.find((c) => c[0] === st.cur) || offered[0];
    return {
      lang: lang,
      t: lang.t,
      langs: LANGS.map((l, i) => {
        const sel = l.id === lang.id;

          name: l.name, en: l.en, short: l.short, tag: l.tag, device: !!l.device, sel: sel,

          pick: () => this.setState({ lang: l.id, cur: l.cur.slice(0, MAX_CURRENCIES).some((c) => c[0] === cur[0]) ? cur[0] : null })
        };
      }),
      curs: offered.map((c) => {
        const sel = c[0] === cur[0];
        return {
          sym: c[1], code: c[0], label: c[2] + ' ' + c[0], sel: sel,
