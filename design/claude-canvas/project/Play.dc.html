<div style="position: absolute; left: 16px; right: 16px; top: 46px; display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 10px; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ c.hudLine }}; border-radius: 18px; background: {{ c.hudBg }}; color: {{ c.hudInk }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 15px; font-weight: 700">Age 15 · 2041<span aria-hidden="true" style="display: flex; width: 34px; height: 4px; border-radius: 2px; overflow: hidden; background: {{ c.track }}"><span style="width: 45%; background: {{ c.trackFill }}"></span></span></span>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ cycleSpeed }}" aria-label="Change speed" style="height: 44px; min-width: 56px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ c.hudLine }}; border-radius: 22px; background: {{ c.hudBg }}; color: {{ c.hudInk }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">{{ speed }}×</button>
<button type="button" onClick="{{ togglePause }}" aria-label="{{ pauseLabel }}" style="width: 44px; height: 44px; box-sizing: border-box; padding: 0; border: 1px solid {{ c.hudLine }}; border-radius: 22px; background: {{ c.hudBg }}; color: {{ c.hudInk }}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{ running }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5Z" fill="currentColor"></path></svg></sc-if>
</button>
</div>
</div>
<section aria-label="Aarav at fifteen" style="position: absolute; left: 16px; right: 16px; top: 334px; box-sizing: border-box; padding: 14px 16px 16px; border: 1px solid {{ c.cardLine }}; border-radius: 24px; background: {{ c.card }}">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.4px">Aarav Srivastava</h1>
<span style="font-size: 13px; line-height: 1.3; color: {{ c.muted }}; white-space: nowrap">Lucknow, India</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin-top: 14px">
<sc-for list="{{ stats }}" as="st" hint-placeholder-count="4">
<div aria-label="{{ st.aria }}">
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; line-height: 1.2">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 600; color: {{ c.muted }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ st.color }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ st.icon }}"></path></svg>{{ st.label }}</span>
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums">{{ st.v }}</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 3px; margin-top: 6px">
<sc-for list="{{ st.segs }}" as="sg" hint-placeholder-count="10"><span style="flex: 1; height: 8px; border-radius: 4px; background: {{ sg.bg }}"></span></sc-for>
</div>
</div>
</sc-for>
</div>
</section>
<div style="position: absolute; left: 20px; right: 20px; top: 494px">
<p style="margin: 0; font-size: 12px; font-weight: 700; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; color: {{ c.muted }}">Spring 2041</p>
<ol style="list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ log }}" as="lg" hint-placeholder-count="2">
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.4">
<span style="flex: none; min-width: 64px; height: 24px; box-sizing: border-box; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: {{ lg.bg }}; color: {{ lg.ink }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 13px; font-weight: 800; white-space: nowrap">{{ lg.delta }}</span>
<span>{{ lg.text }}</span>
</li>
</sc-for>
</ol>
</div>

</svg>
<div style="min-width: 0">
<p style="margin: 0; font-size: 12px; font-weight: 800; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; color: {{ c.dlgName }}">Dad</p>
<p style="margin: 3px 0 0; font-size: 16px; line-height: 1.45">{{ line }}</p>
</div>
</div>
<sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px">
<sc-for list="{{ options }}" as="op" hint-placeholder-count="2">
<button type="button" onClick="{{ op.pick }}" onMouseEnter="{{ op.point }}" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px 0 12px; border: 0; border-radius: 16px; background: {{ op.bg }}; color: {{ op.ink }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 17px; font-weight: 800; text-align: left; cursor: pointer">
<span aria-hidden="true" style="display: flex; flex: none; width: 12px; opacity: {{ op.cursor }}"><svg width="12" height="14" viewBox="0 0 12 14"><path d="M1.5 1.5v11l9-5.5Z" fill="currentColor"></path></svg></span>
<span style="flex: 1">{{ op.label }}</span>
<span style="font-family: Figtree, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: {{ op.hint }}; white-space: nowrap">{{ op.effect }}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ effects }}" as="ef" hint-placeholder-count="2"><span style="height: 26px; padding: 0 10px; border-radius: 13px; display: inline-flex; align-items: center; background: {{ ef.bg }}; color: {{ ef.ink }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 13px; font-weight: 800; white-space: nowrap">{{ ef.t }}</span></sc-for>
</div>
<button type="button" onClick="{{ again }}" style="flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 18px; border: 0; border-radius: 23px; background: {{ c.nextBg }}; color: {{ c.nextInk }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">Continue<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>
</section>
<svg width="393" height="852" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none; mix-blend-mode: {{ c.grainBlend }}; opacity: {{ c.grainOp }}">
<filter id="{{ ids.grain }}"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="393" height="852" filter="{{ urls.grain }}"></rect>
</svg>
</main>
</x-dc>

    dlgBg: 'linear-gradient(160deg, #3d3196 0%, #262058 100%)', dlgInk: '#f6f1ea', dlgName: '#f2d7a6',
    optOnBg: '#f6cfe0', optOnInk: '#18171c', optOnHint: '#5a4a63',
    optOffBg: 'rgba(255,255,255,0.08)', optOffInk: '#f6f1ea', optOffHint: '#b9b0d8',
    dlgGoodBg: 'rgba(143,216,184,0.16)', dlgGoodInk: '#8fd8b8', dlgBadBg: 'rgba(255,158,176,0.16)', dlgBadInk: '#ff9eb0',
    nextBg: '#f6cfe0', nextInk: '#18171c',
    face: { bg: '#6e5ce6', skin: '#9c6040', hair: '#18171c', shirt: '#f6f1ea' },
    grainBlend: 'overlay', grainOp: 0.28
  }
};

var ICONS = {
  health: 'M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6Z',
  joy: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  mind: 'M4 6.5c2.6-1.2 5.3-1.2 8 .8 2.7-2 5.4-2 8-.8V18c-2.6-1.2-5.3-1.2-8 .8-2.7-2-5.4-2-8-.8ZM12 7.3v11.5',
  ties: 'M9 11a3 3 0 1 0 0-6a3 3 0 1 0 0 6M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M16 11a2.5 2.5 0 1 0 0-5M17 14c2.4.3 4 1.9 4 4.5'
};

var ASK = 'The shop isn’t doing well, beta. I need you at the counter. Grade 11 can wait.';

var CHOICES = [
  {
    label: 'Stay in school', effect: '+Mind −Money', mind: 6,
    reply: '…Fine. Study, then. But on Sundays you’re at the counter.',
    effects: [{ t: '+6 Mind', good: true }, { t: '−4 Money', good: false }],
    log: { delta: '+6 Mind', text: 'Started grade 11. Sundays at the shop.', good: true }
  },
  {
    label: 'Work the counter', effect: '+Money −Mind', mind: -6,
    reply: 'Good. We open at seven. Wear the clean shirt.',
    effects: [{ t: '+5 Money', good: true }, { t: '−6 Mind', good: false }],
    log: { delta: '+5 Money', text: 'First day behind the shop counter.', good: true }
  }
];

var LOG = [
  { delta: '+4 Mind', text: 'Passed the grade 10 boards with 81%.', good: true },
  { delta: '−3 Joy', text: 'Ananya left for college in Delhi.', good: false }
];

class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const c = COLORS[theme];
    const st = this.state || {};
    const speeds = [1, 4, 16];
    const speed = st.speed || 4;
    const paused = !!st.paused;
    const cur = st.cur || 0;
    const picked = typeof st.picked === 'number' ? CHOICES[st.picked] : null;
    const mind = 71 + (picked ? picked.mind : 0);
    const bar = (key, label, v) => ({
      label: label,
      v: v,
      color: c[key],
      icon: ICONS[key],
      aria: label + ' ' + v + ' of 100',
      segs: Array.from({ length: 10 }, (_, i) => ({ bg: i < Math.round(v / 10) ? c[key] : c.segOff }))
    });
    const chip = (e, onDialog) => ({
      delta: e.delta,
      text: e.text,
      t: e.t,
      bg: onDialog ? (e.good ? c.dlgGoodBg : c.dlgBadBg) : (e.good ? c.goodBg : c.badBg),
      ink: onDialog ? (e.good ? c.dlgGoodInk : c.dlgBadInk) : (e.good ? c.goodInk : c.badInk)
    });
    const log = LOG.concat(picked ? [picked.log] : []).map((e) => chip(e, false));
    return {
      theme: theme,
      c: c,
      f: c.face,
      s: SCENES[theme],
      sceneLabel: SCENES[theme].label,
      ids: { sky: 'pl-sky-' + theme, face: 'pl-face-' + theme, grain: 'pl-grain-' + theme },
      urls: { sky: 'url(#pl-sky-' + theme + ')', face: 'url(#pl-face-' + theme + ')', grain: 'url(#pl-grain-' + theme + ')' },
      stats: [bar('health', 'Health', 82), bar('joy', 'Joy', 64), bar('mind', 'Mind', mind), bar('ties', 'Ties', 58)],
      log: log,
      line: picked ? picked.reply : ASK,
      asking: !picked,
      answered: !!picked,
      effects: picked ? picked.effects.map((e) => chip(e, true)) : [],
      options: CHOICES.map((o, i) => ({
        label: o.label,
        effect: o.effect,
        bg: i === cur ? c.optOnBg : c.optOffBg,
        ink: i === cur ? c.optOnInk : c.optOffInk,
        hint: i === cur ? c.optOnHint : c.optOffHint,
        cursor: i === cur ? 1 : 0,
        point: () => { if (cur !== i) this.setState({ cur: i }); },
        pick: () => this.setState({ cur: i, picked: i })
      })),
      again: () => this.setState({ picked: null, cur: 0 }),
      speed: speed,
      paused: paused,
      running: !paused,
      pauseLabel: paused ? 'Resume' : 'Pause',
      togglePause: () => this.setState({ paused: !paused }),
      cycleSpeed: () => this.setState({ speed: speeds[(speeds.indexOf(speed) + 1) % speeds.length] })
    };
  }
}
</script>
</body>
</html>
