<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birth roll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
main[data-theme=light] a:focus-visible,main[data-theme=light] button:focus-visible{outline:3px solid #17352e;outline-offset:4px}
main[data-theme=dark] a:focus-visible,main[data-theme=dark] button:focus-visible{outline:3px solid #f6cfe0;outline-offset:4px}
</style>
</helmet>
<main data-theme="{{ theme }}" style="position: relative; width: 393px; height: 852px; box-sizing: border-box; padding: 60px 28px 112px; overflow: hidden; background: {{ t.bg }}; color: {{ t.ink }}; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center">
<div aria-hidden="true" style="position: absolute; left: -33px; top: 66px; width: 460px; height: 460px; border-radius: 50%; background: {{ t.glow }}"></div>
<button type="button" onClick="{{ replay }}" aria-label="Replay the spin" style="position: absolute; right: 16px; top: 48px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border: 1.5px solid {{ t.dialLine }}; border-radius: 22px; background: {{ t.dialBg }}; color: {{ t.muted }}; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{ revealOp }}; visibility: {{ revealVis }}; transition: opacity 0.6s ease"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v4.5h-4.5"></path></svg></button>
<p style="position: relative; margin: 0; font-size: 12px; font-weight: 700; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ t.muted }}">{{ label }}</p>
<p aria-hidden="true" style="position: relative; margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 60px; font-weight: 800; line-height: 64px; letter-spacing: -2px; white-space: nowrap; opacity: {{ nameOp }}; transform: scale({{ nameScale }}); transition: opacity 0.35s ease, transform 0.35s ease">{{ country }}</p>
<p role="status" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{ status }}</p>
<div style="position: relative; width: 300px; height: 300px; margin-top: 6px; flex: none">
<dc-import name="Globe" size="300" variant="halftone" land="{{ g.land }}" ocean="{{ g.ocean }}" shade="{{ g.shade }}" night="{{ g.night }}" rim="{{ g.rim }}" grid="{{ g.grid }}" flash="{{ g.flash }}" marker="{{ g.marker }}" marker-ring="{{ g.ring }}" dot="1.15" spin="8" start-lon="-40" focus="{{ spinning }}" turns="3" duration="4600" zoom="2.4" hint-size="300px,300px"></dc-import>
</div>
<div style="position: relative; width: 100%; height: 124px; margin-top: 18px">
<p style="position: absolute; left: 0; right: 0; top: 8px; margin: 0; font-size: 17px; line-height: 1.5; color: {{ t.muted }}; opacity: {{ hintOp }}; transition: opacity 0.4s ease">Every birth is a roll of the dice.</p>
<div style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; opacity: {{ revealOp }}; visibility: {{ revealVis }}; transform: translateY({{ revealY }}px); transition: opacity 0.6s ease, transform 0.6s ease">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; box-sizing: border-box; padding: 0 14px 0 10px; border: 1.5px solid {{ t.dialLine }}; border-radius: 12px; background: {{ t.dialBg }}; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ t.accent }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11Z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>Lucknow, Uttar Pradesh</span>
<p style="margin: 16px 0 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -0.2px">1 in 6 babies starts here.<br><span style="color: {{ t.accent }}">Today, that’s you.</span></p>
</div>
</div>
<a href="{{ cardHref }}" style="position: relative; margin-top: auto; display: flex; align-items: center; justify-content: space-between; width: 204px; min-height: 64px; box-sizing: border-box; padding: 0 8px 0 26px; border-radius: 32px; background: {{ t.btnBg }}; color: {{ t.btnInk }}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 20px; font-weight: 800; text-decoration: none; opacity: {{ revealOp }}; visibility: {{ revealVis }}; transform: translateY({{ revealY }}px); transition: opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s">Who am I?<span style="width: 48px; height: 48px; border-radius: 24px; background: {{ t.btnDot }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ t.btnArrow }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<svg width="393" height="852" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; pointer-events: none; mix-blend-mode: {{ t.grainBlend }}; opacity: {{ t.grainOp }}">
<filter id="{{ grainId }}"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="393" height="852" filter="{{ grainUrl }}"></rect>
</svg>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":393,"height":852}}'>
// The globe spins like a roulette wheel while country names flip where the logo was,
// lands on the birthplace, zooms in, and only then reveals the city and the way on.
var THEMES = {
  light: {
    bg: '#f4ede1', ink: '#17352e', muted: '#4e5f58', accent: '#e5533c',
    dialBg: 'rgba(255,255,255,0.5)', dialLine: 'rgba(23,53,46,0.16)',
    btnBg: '#e5533c', btnInk: '#ffffff', btnDot: '#17352e', btnArrow: '#ffffff',
    glow: 'radial-gradient(closest-side, rgba(106,174,224,0.5) 0%, rgba(106,174,224,0.3) 58%, rgba(106,174,224,0) 100%)',
    grainBlend: 'multiply', grainOp: 0.18,
    globe: { land: '#17352e', ocean: '#a9d3ee', shade: '#4f8fc0', night: 'rgba(23,53,46,0.22)', rim: '', grid: '', flash: '#e5533c', marker: '#e5533c', ring: '#f4ede1' }
  },
  dark: {
    bg: '#18171c', ink: '#f6f1ea', muted: '#a9a3b8', accent: '#ff9eb0',
    dialBg: 'rgba(255,255,255,0.04)', dialLine: 'rgba(246,241,234,0.16)',
    btnBg: '#f6cfe0', btnInk: '#18171c', btnDot: '#18171c', btnArrow: '#f6cfe0',
    glow: 'radial-gradient(closest-side, rgba(118,98,240,0.55) 0%, rgba(118,98,240,0.3) 58%, rgba(118,98,240,0) 100%)',
    grainBlend: 'overlay', grainOp: 0.3,
    globe: { land: '#f4e4dc', ocean: '#3b30a0', shade: '#17124a', night: 'rgba(12,10,32,0.22)', rim: 'rgba(246,241,234,0.35)', grid: 'rgba(246,241,234,0.08)', flash: '#ffd9a0', marker: '#ff9eb0', ring: '#18171c' }
  }
};

// Must match the Globe's duration; the reveal waits for the zoom to settle.
var SPIN_MS = 4600, START_DELAY = 400, REVEAL_DELAY = 1300;
var NAMES = ['Brazil', 'Nigeria', 'China', 'Germany', 'Pakistan', 'Ethiopia', 'Mexico', 'Indonesia', 'Egypt', 'Japan', 'Kenya', 'USA', 'Vietnam', 'DR Congo', 'Iran', 'Tanzania', 'Turkey', 'Uganda', 'Colombia', 'Sudan', 'Russia', 'Ghana', 'Peru', 'Nepal', 'Morocco', 'Angola', 'Nigeria', 'China', 'Pakistan', 'India'];

class Component extends DCLogic {
  componentDidMount() {
    this.roll();
  }
  componentWillUnmount() {
    clearTimeout(this.kick);
    clearInterval(this.tick);
  }
  roll() {
    clearTimeout(this.kick);
    clearInterval(this.tick);
    this.t0 = 0;
    this.setState({ spinning: false, landedAt: 0 });
    this.kick = setTimeout(() => {
      this.t0 = Date.now();
      this.setState({ spinning: true });
      this.tick = setInterval(() => {
        const now = Date.now();
        const landedAt = (this.state && this.state.landedAt) || 0;
        if (!landedAt && now - this.t0 >= SPIN_MS) this.setState({ landedAt: now });
        else if (landedAt && now - landedAt > REVEAL_DELAY + 800) clearInterval(this.tick);
        this.forceUpdate();
      }, 50);
    }, START_DELAY);
  }
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = THEMES[theme];
    const st = this.state || {};
    const now = Date.now();
    const landed = !!st.landedAt;
    const revealed = landed && now - st.landedAt >= REVEAL_DELAY;
    // Names flip fast, then slower, settling just before the globe stops.
    let idx = 0;
    if (st.spinning && this.t0) {
      const p = Math.min(1, (now - this.t0) / SPIN_MS);
      idx = Math.min(NAMES.length - 1, Math.floor((1 - Math.pow(1 - p, 2)) * NAMES.length));
    }
    if (landed) idx = NAMES.length - 1;
    return {
      theme: theme,
      t: t,
      g: t.globe,
      grainId: 'rl-grain-' + theme,
      grainUrl: 'url(#rl-grain-' + theme + ')',
      cardHref: theme === 'dark' ? 'CertDark.dc.html' : 'Cert.dc.html',
      spinning: !!st.spinning,
      label: landed ? 'You are born in' : 'Where will you be born?',
      country: NAMES[idx],
      status: landed ? 'You are born in Lucknow, India.' : '',
      nameOp: landed ? 1 : 0.55,
      nameScale: landed ? 1 : 0.9,
      hintOp: landed ? 0 : 1,
      revealOp: revealed ? 1 : 0,
      revealVis: revealed ? 'visible' : 'hidden',
      revealY: revealed ? 0 : 10,
      replay: () => this.roll()
    };
  }
}
</script>
</body>
</html>
