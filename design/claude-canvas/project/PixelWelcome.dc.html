<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cozy Pixel — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Rubik:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ffb35c}a:hover{color:#fbefd9}
a:focus-visible,button:focus-visible{outline:3px dashed #fbefd9;outline-offset:6px}
</style>
</helmet>
<main style="position: relative; width: 393px; height: 852px; box-sizing: border-box; padding: 0 28px 44px; overflow: hidden; background: #241c2e; color: #fbefd9; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center">
<svg width="393" height="420" viewBox="0 0 393 420" shape-rendering="crispEdges" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g fill="#fbefd9">
<rect x="30" y="60" width="4" height="4"></rect><rect x="96" y="34" width="4" height="4"></rect><rect x="350" y="70" width="4" height="4"></rect><rect x="300" y="30" width="4" height="4"></rect><rect x="18" y="300" width="4" height="4"></rect><rect x="368" y="330" width="4" height="4"></rect><rect x="200" y="24" width="4" height="4"></rect>
</g>
<g fill="#ffb35c">
<rect x="340" y="140" width="4" height="12"></rect><rect x="336" y="144" width="12" height="4"></rect>
<rect x="44" y="200" width="4" height="12"></rect><rect x="40" y="204" width="12" height="4"></rect>
</g>
<g fill="#5d4a73">
<rect x="70" y="372" width="8" height="8"></rect><rect x="315" y="364" width="8" height="8"></rect><rect x="330" y="372" width="8" height="8"></rect>
</g>
</svg>
<div style="position: relative; width: 300px; height: 300px; margin-top: 66px; flex: none">
<dc-import name="Globe" size="300" variant="square" px="5" land="#9be08c" ocean="#3b4e9c" shade="#1b2357" flash="#ffb35c" marker="#ff6b8a" marker-ring="#241c2e" spin="9" start-lon="100" focus="{{ born }}" hint-size="300px,300px"></dc-import>
</div>
<h1 style="margin: 30px 0 0; font-family: 'Pixelify Sans', monospace; font-size: 66px; font-weight: 700; line-height: 1; letter-spacing: 1px; white-space: nowrap; text-shadow: 4px 4px 0 #ff6b8a">1 in 8 B</h1>
<sc-if value="{{ unborn }}" hint-placeholder-val="{{ true }}">
<p style="max-width: 320px; margin: 20px 0 0; text-align: center; font-size: 16px; line-height: 1.6; color: #cdbeda">The world rolls the dice four times a second. Your turn is next. One life, start to finish, no restarts.</p>
<div style="display: flex; gap: 14px; margin-top: 22px">
<div style="min-width: 112px; padding: 8px 12px; background: #31263d; box-shadow: 0 -3px 0 0 #5d4a73, 0 3px 0 0 #5d4a73, -3px 0 0 0 #5d4a73, 3px 0 0 0 #5d4a73; text-align: center">
<p style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 26px; font-weight: 600; line-height: 1.1; color: #ffb35c; font-variant-numeric: tabular-nums">{{ bornCount }}</p>
<p style="margin: 2px 0 0; font-size: 12px; line-height: 1.3; color: #cdbeda">born</p>
</div>
<div style="min-width: 112px; padding: 8px 12px; background: #31263d; box-shadow: 0 -3px 0 0 #5d4a73, 0 3px 0 0 #5d4a73, -3px 0 0 0 #5d4a73, 3px 0 0 0 #5d4a73; text-align: center">
<p style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 26px; font-weight: 600; line-height: 1.1; color: #c9b3c9; font-variant-numeric: tabular-nums">{{ diedCount }}</p>
<p style="margin: 2px 0 0; font-size: 12px; line-height: 1.3; color: #cdbeda">passed away</p>
</div>
</div>
<p style="margin: 10px 0 0; font-size: 12px; line-height: 1.4; color: #a898b8">since you pressed start</p>
</sc-if>
<sc-if value="{{ born }}" hint-placeholder-val="{{ false }}">
<p style="margin: 20px 0 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 600; line-height: 1.3; color: #ff6b8a">It’s a boy!</p>
<p style="max-width: 320px; margin: 8px 0 0; text-align: center; font-size: 16px; line-height: 1.6; color: #cdbeda">Aarav Srivastava · Lucknow, India<br>14 March 2026, 04:12</p>
</sc-if>
<sc-if value="{{ unborn }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ beBorn }}" style="margin-top: auto; width: 100%; min-height: 60px; border: 0; background: #ffb35c; color: #241c2e; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 700; letter-spacing: 1px; cursor: pointer; box-shadow: 0 -4px 0 0 #fbefd9, 0 4px 0 0 #fbefd9, -4px 0 0 0 #fbefd9, 4px 0 0 0 #fbefd9, inset 0 -6px 0 0 #d9843a">BE BORN</button>
</sc-if>
<sc-if value="{{ born }}" hint-placeholder-val="{{ false }}">
<a href="PixelLife.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; background: #9be08c; color: #241c2e; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 700; letter-spacing: 1px; text-decoration: none; box-shadow: 0 -4px 0 0 #fbefd9, 0 4px 0 0 #fbefd9, -4px 0 0 0 #fbefd9, 4px 0 0 0 #fbefd9, inset 0 -6px 0 0 #6fb062">START LIFE</a>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.openedAt = Date.now();
    this.timer = setInterval(() => this.forceUpdate(), 250);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const born = !!(this.state && this.state.born);
    const secs = this.openedAt ? (Date.now() - this.openedAt) / 1000 : 0;
    // About 4.2 births and 2 deaths every second worldwide.
    return {
      born: born,
      unborn: !born,
      bornCount: Math.floor(secs * 4.2).toLocaleString('en-US'),
      diedCount: Math.floor(secs * 2).toLocaleString('en-US'),
      beBorn: () => this.setState({ born: true })
    };
  }
}
</script>
</body>
</html>
