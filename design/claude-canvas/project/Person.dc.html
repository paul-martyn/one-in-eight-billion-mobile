      var bb = hs.bumps;
      for (var q = 0; q < bb[4]; q++) {
        var ang = (bb[2] + (bb[3] - bb[2]) * q / (bb[4] - 1)) * Math.PI / 180;
        L.hairFront += circle(cx + Math.cos(ang) * bb[0] * rad, hy - 0.2 * rad - Math.sin(ang) * bb[0] * rad, bb[1] * rad);
      }
    }
    var showEars = !hs.hidesEars && headwear !== 'scarf';
    if (showEars) {
      var earSides = turned ? [-1] : [-1, 1];
      earSides.forEach(function (s) {
        var E = headMapper(cx, hy, rad, dir * s, turned ? function (u) { return u * 0.96 + 0.02; } : null);
        L.ears += E(EAR);
        L.earLines += E(EAR_LINE);
      });
    }
    if (headwear === 'gele') L.headwear = H(GELE_SHAPE, 'hair') + ellipse(cx + dir * 0.6 * rad, hy - 1.45 * rad, 0.38 * rad, 0.28 * rad);
    if (headwear === 'scarf') {
      L.headwear = H(SCARF_SHAPE, turned ? 'hair' : '');
      L.hairBack = '';
      L.hairFront = '';
    }
  }

  if (o.night > 0) {
    Object.keys(C).forEach(function (key) {
      if (C[key].charAt(0) === '#') C[key] = mix(C[key], NIGHT, o.night * 0.45);
    });
  }
  return { L: L, C: C, S: S, hy: hy, label: WORDS[stage][f ? 0 : 1] + ', ' + o.age + (stage === 'infant' ? '' : ', ' + outfit) };
}

class Component extends DCLogic {
  num(key, fallback) {
    var v = this.props[key];
    if (v === undefined || v === null || v === '') return fallback;
    v = Number(v);
    return isFinite(v) ? v : fallback;
  }
  str(key, fallback) {
    var v = this.props[key];
    return v === undefined || v === null || v === '' ? fallback : String(v);
  }
  renderVals() {
    var o = {
      seed: this.num('seed', 7), age: Math.max(0, this.num('age', 30)), sex: this.str('sex', 'f'), region: this.str('region', 'south-asia'),
      facing: this.str('facing', 'front'), pose: this.str('pose', 'auto'),
      outfit: this.str('outfit', ''), hair: this.str('hair', ''), hairColor: this.str('hairColor', ''), skin: this.num('skin', -1),
      build: this.str('build', 'auto'), beard: this.str('beard', ''), mouth: this.str('mouth', ''),
      top: this.str('top', ''), bottom: this.str('bottom', ''), accent: this.str('accent', ''), night: this.num('night', 0)
    };
    var key = JSON.stringify(o);
    if (this.key !== key) {
      this.key = key;
      this.person = drawPerson(o);
    }
    var p = this.person, h = this.num('height', 300), portrait = this.str('crop', 'full') === 'portrait';
    return {
      L: p.L, C: p.C, S: p.S, label: p.label, h: h,
      w: portrait ? h : h / 2,
      wobble: portrait ? 0.8 : 1.2,
      vb: portrait ? '22 ' + n(p.hy - 27) + ' 56 56' : '0 0 100 200'
    };
  }
}
</script>
