<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["off","on"],"default":"off"},"rewards":{"editor":"enum","options":["off","on"],"default":"off"},"nav":{"editor":null},"$preview":{"width":393,"height":852}}'>
// The hub between lives, in the cute style. At the top, the settings and the three currencies —
// energy (one per life, refilling over time), dollars (the main currency) and gems (bought) —
// each with a plus to get more; in the middle the spinning planet with the births and deaths since the
// game was opened, and Be Born, which costs one energy.
// The menu is one bar of three folder tabs over a band in the open tab's colour: Shop (a stub for
// now), World (this screen) and Lives (every life played; a new story waits). The closed tabs
// show only their icons; the open one widens a little and rises with its name, pushing the others
// aside, and the band quickly takes its colour. The screen above stays as it is for now.
// With `demo: on` the tabs take turns opening until the first tap. With `rewards: on` (back from a
// finished life) a small pop-up says a life was lived and lists the rewards earned for what was done
// in it; its one Claim button sends them flying into the dollar and gem counters and the portrait
// into the Lives tab, where the story is kept.
// Be Born spends the energy, then hides the whole interface — the top slides up, the menu down,
// counters and button fade — leaving only the planet, where the birth roll has it, and moves on
// to the roll. The hub arrives the same way played backwards: it starts hidden and everything
// glides into place around the planet while the currencies count up.

// Inside the prototype the host passes `nav` and moves between screens itself; on its own an
// artboard follows plain links.
function linkTo(self, stem) {
  return typeof self.props.nav === 'function'
    ? { href: null, go: () => self.props.nav(stem) }
    : { href: stem + '.dc.html', go: null };
}
var STICKER_STEMS = { people: 'PeopleCute', activities: 'ActivitiesCute', life: 'LiveCute', money: 'MoneyCute', odds: 'OddsLife' };
function stickerLinks(self) {
  const out = {};
  Object.keys(STICKER_STEMS).forEach((k) => { out[k] = linkTo(self, STICKER_STEMS[k]); });
  return out;
}

// Bars fill and numbers count up once, as the screen appears.
var ENTER_MS = 900;
function startEnter(self) {
  self.enterAt = Date.now();
  self.enterTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - self.enterAt) / ENTER_MS);
    self.setState({ enterP: p });
    if (p >= 1) clearInterval(self.enterTimer);
  }, 30);
}
function entered(self) {
  const p = (self.state && self.state.enterP) || 0;
  return 1 - Math.pow(1 - p, 3);
}

var ENERGY = 3, ENERGY_MAX = 5, COST = 1;
var DOLLARS = 2450, GEMS = 35;
var REWARD_DOLLARS = 250, REWARD_GEMS = 2;
// What the life earned, and for what.
var REWARDS = [
  { text: 'Stayed in school', amount: '+60', dot: '#6f8cff' },
  { text: 'First job, at a bank', amount: '+40', dot: '#8fd14f' },
  { text: 'Married Meera', amount: '+50', dot: '#ff6f8a' },
  { text: 'Paid off the family’s old debt', amount: '+100', dot: '#ffc23d' },
  { text: 'First life born in India', amount: '+2', dot: '#ff7ad9', gem: true }
];
// The pop-up opens after the hub has arrived; Claim can't be pressed until it has settled.
var POPUP_AT = 800, READY_MS = 450, FLY_MS = 700, LAND_MS = 700;
// From the pop-up's total to the dollar and gem counters, and from its portrait to the Lives tab.
var FLY = { d: 'translate(-22px, -415px) scale(0.6)', g: 'translate(18px, -415px) scale(0.6)', face: 'translate(127px, 618px) scale(0.3)' };
var REFILL_S = 18 * 60 + 24;
var LEAVE_MS = 800, BACK_MS = 2800, SHOW_MS = 50;
// Leaving speeds up as it goes; arriving is the same curve backwards, so it lands softly.
var AWAY = 'cubic-bezier(.5,0,.75,0)', ARRIVE = 'cubic-bezier(.25,1,.5,1)';
var TABS = [{ key: 'shop', color: '#8fd14f' }, { key: 'world', color: '#ffd75a' }, { key: 'lives', color: '#b48cff' }];
// Quick out, soft landing: the tab never overshoots the band line. The widening may.
var GLIDE = 'cubic-bezier(.2,.9,.3,1)', SPRING = 'cubic-bezier(.3,1.4,.5,1)';
var TAB_MS = 300;
var DEMO = ['lives', 'shop', 'world'];
var DEMO_MS = 1600;

class Component extends DCLogic {
  componentDidMount() {
    this.openedAt = Date.now();
    this.timer = setInterval(() => this.forceUpdate(), 250);
    startEnter(this);
    this.show = setTimeout(() => this.setState({ shown: true }), SHOW_MS);
    if (this.props.rewards === 'on') {
      this.rewardTimers = [
        setTimeout(() => this.setState({ rewardOpen: true }), SHOW_MS + POPUP_AT),
        setTimeout(() => this.setState({ claimReady: true }), SHOW_MS + POPUP_AT + READY_MS)
      ];
    }
    if (this.props.demo !== 'on') return;
    let step = 0;
    this.demo = setInterval(() => {
      if ((this.state || {}).tapped) return clearInterval(this.demo);
      this.setState({ tab: DEMO[step++ % DEMO.length] });
    }, DEMO_MS);
  }
  // Claim: the pop-up goes, the rewards and the portrait fly, then the counters count up and the
  // Lives tab gets its new story.
  claim() {
    const st = this.state || {};
    if (st.rewardStep || !st.claimReady) return;
    this.setState({ rewardStep: 1 });
    this.rewardTimers.push(setTimeout(() => this.setState({ rewardStep: 2 }), 40));
    this.rewardTimers.push(setTimeout(() => {
      this.setState({ rewardStep: 3, landAt: Date.now() });
      this.landTick = setInterval(() => this.forceUpdate(), 40);
    }, 40 + FLY_MS));
    this.rewardTimers.push(setTimeout(() => clearInterval(this.landTick), 40 + FLY_MS + LAND_MS + 100));
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearInterval(this.demo);
    clearInterval(this.enterTimer);
    clearTimeout(this.show);
    clearTimeout(this.leave);
    clearTimeout(this.back);
    (this.rewardTimers || []).forEach(clearTimeout);
    clearInterval(this.landTick);
  }
  renderVals() {
    const st = this.state || {};
    const secs = this.openedAt ? (Date.now() - this.openedAt) / 1000 : 0;
    // About 4.2 births and 2 deaths every second worldwide.
    const born = Math.floor(secs * 4.2).toLocaleString('en-US');
    const died = Math.floor(secs * 2).toLocaleString('en-US');
    const leaving = !!st.leaving;
    const step = st.rewardStep || 0;
    const landed = step >= 3 ? Math.min(1, (Date.now() - st.landAt) / LAND_MS) : 0;
    const landK = 1 - Math.pow(1 - landed, 3);
    const rewards = this.props.rewards === 'on';
    const flying = (key) => ({ o: step >= 2 ? 0.25 : 1, t: step >= 2 ? FLY[key] : 'translate(0px, 0px) scale(1)' });
    // Hidden before the first show and again while leaving.
    const hidden = leaving || !st.shown;
    const k = entered(this);
    const to = { lang: linkTo(this, 'LangCute'), roll: linkTo(this, 'RollCute') };
    const tab = st.tab || 'world';
    const energy = leaving ? ENERGY - COST : ENERGY;
    const left = Math.max(0, Math.ceil(REFILL_S - secs));
    const move = 'transform ' + TAB_MS + 'ms ' + GLIDE;
    const widen = 'flex-grow ' + TAB_MS + 'ms ' + SPRING;
    const tb = {};
    TABS.forEach((t) => {
      const on = t.key === tab;
      tb[t.key] = {
        cur: on ? 'page' : 'false',
        // Each tab is cut off at the band's top line. The open one rises a little and widens a little,
        // its line there goes so it runs into the band, its icon pops and its name fades in; a closing
        // one sinks, gets its line back and its name fades out.
        y: on ? 0 : 16, grow: on ? 1.3 : 1, tr: move, wtr: widen,
        line: on ? 0 : 1, lo: on ? 1 : 0, ld: on ? '0.08s' : '0s',
        pop: on ? 'kh-pop 0.35s ease-out' : 'none',
        pick: () => { if (!st.leaving) this.setState({ tab: t.key, tapped: true }); }
      };
    });
    return {
      bornCount: born,
      diedCount: died,
      countersLabel: 'Since you opened the game: ' + born + ' born, ' + died + ' passed away',
      energy: energy,
      energyShown: Math.round(energy * k),
      energyLabel: 'Energy ' + energy + ' of ' + ENERGY_MAX,
      refill: '+1 in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'),
      dollars: Math.round(DOLLARS * k + REWARD_DOLLARS * landK).toLocaleString('en-US'),
      dollarsLabel: (DOLLARS + (step >= 3 ? REWARD_DOLLARS : 0)).toLocaleString('en-US') + ' dollars',
      gems: Math.round(GEMS * k + REWARD_GEMS * landK),
      gemsLabel: (GEMS + (step >= 3 ? REWARD_GEMS : 0)) + ' gems',
      rw: {
        popOn: rewards && !!st.rewardOpen && step < 3, popOp: step >= 1 ? 0 : 1, popScale: step >= 1 ? 0.92 : 1,
        claimPe: st.claimReady && !step ? 'auto' : 'none',
        claim: () => this.claim(),
        list: REWARDS.map((r, i) => ({ text: r.text, amount: r.amount, dot: r.dot, bill: !r.gem, gem: !!r.gem, delay: (0.35 + i * 0.1).toFixed(2) })),
        flyOn: rewards && step >= 1 && step < 3,
        d: flying('d'), g: flying('g'), face: flying('face'),
        tr: 'transform ' + FLY_MS + 'ms cubic-bezier(.5,0,.75,0), opacity ' + FLY_MS + 'ms ease-in',
        faceTr: 'transform ' + FLY_MS + 'ms cubic-bezier(.45,0,.7,1), opacity ' + FLY_MS + 'ms ease-in',
        pop: step >= 3 ? 'kh-pop 0.4s ease-out' : 'none',
        badgeO: !rewards || step >= 3 ? 1 : 0,
        badgeAnim: rewards && step >= 3 ? 'kh-pop 0.45s ease-out' : 'kc-pulse 2s ease-in-out infinite'
      },
      to: to,
      tb: tb,
      bandBg: TABS.find((t) => t.key === tab).color,
      // Be Born: the spent energy shows first, then everything but the planet leaves. Arriving runs
      // it backwards — the top first, then the counters and the menu, the button last.
      ease: leaving ? AWAY : ARRIVE,
      upY: hidden ? -150 : 0, upOp: hidden ? 0 : 1, upDelay: leaving ? '0.25s' : '0s',
      midY: hidden ? 24 : 0, midOp: hidden ? 0 : 1, midDelay: leaving ? '0.2s' : '0.1s',
      btnScale: hidden ? 0.8 : 1, btnOp: hidden ? 0 : 1, btnPe: hidden ? 'none' : 'auto', btnDelay: leaving ? '0.1s' : '0.25s',
      navY: hidden ? 140 : 0, navDelay: leaving ? '0.15s' : '0.1s',
      goRef: (el) => { this.goEl = el; },
      born: () => {
        if (st.leaving) return;
        this.setState({ leaving: true });
        // In the prototype the host moves on to the roll and the hub stays hidden.
        if (to.roll.go) {
          this.leave = setTimeout(to.roll.go, LEAVE_MS);
          return;
        }
        this.leave = setTimeout(() => { if (this.goEl) this.goEl.click(); }, LEAVE_MS);
        // While editing the canvas links don't move, so the hub comes back.
        this.back = setTimeout(() => this.setState({ leaving: false }), BACK_MS);
      }
    };
  }
}
</script>
